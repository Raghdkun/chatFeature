security:
  -
    default: []
paths:
  '/api/v1/public/widgets/{key}/config':
    get:
      summary: 'Get the widget config'
      operationId: publicWidgetsConfig
      description: "The PUBLISHED config of the widget with its greetings, enabled categories, availability and the `api` block (drafts never leave the dashboard). Cacheable: `ETag` (a hash of the body without `generatedAt`; `If-None-Match` answers `304`), `Cache-Control: public, max-age=60, stale-while-revalidate=300`, `Vary: Origin`.\n\n`?locale=` is optional and ignored when it is not a locale tag; matching is exact, language, a variant of the language, else the widget default (`data.locale` says which). Only the default and the resolved text block are returned (all blocks without the parameter).\n\n**CORS.** The response carries `Access-Control-Allow-Origin: <origin>` only when the request `Origin` is on the widget's domain list (or is this installation's own origin); `OPTIONS` preflights are answered with `204` for allowed origins (`Allow-Methods: GET, OPTIONS`). Requests without an `Origin` (servers, native apps) need the widget's `allow_non_browser_clients` switch.\n\n**Access.** No credential. The browser `Origin` must be on the widget's domain list; a request without `Origin` is only accepted when the widget allows non-browser clients.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute).\n- `public-config-widget`: 300 a minute per client network and widget key, and 6000 a minute per widget and allowed origin."
      responses:
        200:
          description: 'The resolved boot config.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ResolvedBootConfig'
        304:
          description: 'Not modified: the client already has this version (`If-None-Match`).'
        403:
          description: '`origin_not_allowed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOriginNotAllowed'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Widget config'
      security: []
    parameters:
      -
        in: path
        name: key
        description: "The widget's public key (`wk_` + 20 lower-case letters and digits)."
        example: wk_k3j9x2m5n8p4q7r1s6t0
        required: true
        schema:
          type: string
  '/api/v1/public/widgets/{key}/availability':
    get:
      summary: 'Get the widget availability'
      operationId: publicWidgetsAvailability
      description: "Whether the widget can take chats right now: opening hours of the published config (in the widget's timezone) combined with agent presence. `online` counts only agents the widget's routing waves can offer a chat to, so it never promises a chat that `POST /public/conversations` then refuses with `no_agents`. Cached for 8 seconds on the server and `max-age=5` for the client; `ETag` / `304` as for the config. `whatsapp.enabled` is true only when a connected WhatsApp session is linked and enabled. Same origin rules as the config.\n\n**Access.** No credential. The browser `Origin` must be on the widget's domain list; a request without `Origin` is only accepted when the widget allows non-browser clients.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute).\n- `public-config-widget`: 300 a minute per client network and widget key, and 6000 a minute per widget and allowed origin."
      responses:
        200:
          description: 'Whether a widget can take chats right now (docs/contracts/rest-shapes.md).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Availability'
        304:
          description: 'Not modified (`If-None-Match`).'
        403:
          description: '`origin_not_allowed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOriginNotAllowed'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Widget config'
      security: []
    parameters:
      -
        in: path
        name: key
        description: "The widget's public key (`wk_` + 20 lower-case letters and digits)."
        example: wk_k3j9x2m5n8p4q7r1s6t0
        required: true
        schema:
          type: string
  '/api/v1/public/widgets/{key}/sessions':
    post:
      summary: 'Create a visitor session'
      operationId: publicSessionsStore
      description: "Creates the visitor session and returns its bearer token `vt_...` (**shown once**; only the sha256 is stored) plus where to open the websocket and the limits to check client-side. All input is optional: an anonymous visitor sends nothing, a signed identity (`identity_token`) makes the visitor `verified` and keyed by its `sub` (one visitor across browsers; the claims are authoritative and the pre-chat form never overwrites them). A token that does not verify is refused with `422` and `details.identity_token`: it is never downgraded to anonymous.\n\nThis is the one public call that goes through the widget gate: unknown or disabled key `404 widget_not_found`, a browser `Origin` that is not on the domain list `403 origin_not_allowed` (no CORS headers), and a request without `Origin` only when the widget allows non-browser clients. A browser on another origin cannot call it: the cross-origin preflight is not answered (see the integration guide), so third-party web clients proxy through their backend and native apps call it directly.\n\n**Rotation.** Calling it again with the previous token in `Authorization: Bearer` rotates it: same visitor, a new token, and the previous token keeps working for 60 more seconds (a second tab may be mid-request) and is then `401 session_revoked`. A still-open live chat moves to the new session and is returned in `conversation`.\n\nThe answer is `Cache-Control: no-store`.\n\n**Access.** No credential. The browser `Origin` must be on the widget's domain list; a request without `Origin` is only accepted when the widget allows non-browser clients.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute).\n- `public-session`: 60 a minute per client network and 30 a minute per client network and widget key."
      responses:
        201:
          description: 'The new session. Store `visitorToken`; send it as `Authorization: Bearer` from now on.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        403:
          description: '`origin_not_allowed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOriginNotAllowed'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        422:
          description: '`validation_failed`: `details.identity_token` when a signed identity does not verify, or a field is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Sessions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                identity_token:
                  type: string
                  description: "Signed visitor identity: an HS256 JWT the host website's backend mints with the widget's identity secret. It verifies the visitor and keys them by its `sub`. A token that does not verify is refused (`422`), never downgraded to anonymous. Must not be greater than 8192 characters."
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ3a19rM2o5eDJtNW44cDRxN3IxczZ0MCIsInN1YiI6IjQyIiwiZXhwIjoxNzkwMDAwMzAwfQ.c2lnbmF0dXJl
                  nullable: true
                visitor:
                  type: object
                  description: 'Unsigned visitor details. Stored as given and marked unverified.'
                  example: null
                  properties:
                    name:
                      type: string
                      description: 'Display name. Must not be greater than 120 characters.'
                      example: 'Ada Lovelace'
                      nullable: true
                    email:
                      type: string
                      description: 'E-mail address. Must be a valid email address. Must not be greater than 190 characters.'
                      example: ada@example.com
                      nullable: true
                    phone:
                      type: string
                      description: 'Phone number (digits, spaces and `+ ( ) . -`, 3 to 40 characters). Must match the regex /^[0-9+().\- ]{3,40}$/D.'
                      example: '+15551234567'
                      nullable: true
                    meta:
                      type: object
                      description: 'An object of up to 20 key/value pairs about the visitor. Keys: letters, digits, `.`, `-`, `_`, at most 64 characters. Values: number, boolean or text of at most 500 characters.'
                      example:
                        plan: pro
                      properties: {}
                      nullable: true
                  nullable: true
                page:
                  type: object
                  description: 'The page the visitor is on, as the host page reports it. Shown to agents, never trusted.'
                  example: null
                  properties:
                    url:
                      type: string
                      description: 'Page address. Must not be greater than 2048 characters.'
                      example: 'https://example.com/pricing'
                      nullable: true
                    title:
                      type: string
                      description: 'Page title. Must not be greater than 255 characters.'
                      example: Pricing
                      nullable: true
                    referrer:
                      type: string
                      description: 'Where the visitor came from. Must not be greater than 2048 characters.'
                      example: 'https://www.google.com/'
                      nullable: true
                  nullable: true
                locale:
                  type: string
                  description: "The visitor's locale tag (`en`, `ar`, `pt-BR`). Must match the regex /^[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})*$/D. Must not be greater than 12 characters."
                  example: en
                  nullable: true
      security: []
    parameters:
      -
        in: path
        name: key
        description: "The widget's public key (`wk_` + 20 lower-case letters and digits)."
        example: wk_k3j9x2m5n8p4q7r1s6t0
        required: true
        schema:
          type: string
  /api/v1/public/sessions:
    delete:
      summary: 'End the visit'
      operationId: publicSessionsDestroy
      description: "Revokes **every** active session of the visitor (a leftover token must not outlive an explicit sign-out). A chat still `queued` is cancelled with it; an active one stays (the idle timer closes it). The revocation always happens, even when an agent claims the queued chat a moment earlier.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up."
      responses:
        204:
          description: Revoked.
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Sessions
  /api/v1/public/conversation:
    get:
      summary: "Get the visitor's chat"
      operationId: publicConversationShow
      description: "This session's latest LIVE conversation in **any** status (so the outcome of a `missed` or `closed` chat is readable when no realtime event arrived), or `data: null`. Never a list and never offline tickets: visitors do not see history.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      responses:
        200:
          description: 'The conversation, or `{ "data": null }` when the session has none.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    allOf:
                      -
                        $ref: '#/components/schemas/ConversationPublic'
                    nullable: true
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Conversation
  /api/v1/public/conversations:
    post:
      summary: 'Start a chat'
      operationId: publicConversationsStore
      description: "Creates a live chat in status `queued`; an optional `message` becomes message 1, and the chat is offered to every reachable agent of the category (first accept wins). The widget's pre-chat rules are enforced here: a required, enabled field must be present unless the visitor already has it, a disabled field is ignored, and a consent text needs `consent: true`.\n\n**Anti-automation.** Starting a chat fans an offer out to every reachable agent, so besides the per-minute limits there are two guards that answer `429 rate_limited` with `Retry-After` and `details.retry_after`: after a visitor cancels a queued chat they cannot start another for 10 seconds, and at most 3 live chats wait for an agent at once from one client network on one widget.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      responses:
        201:
          description: 'The chat is queued.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationPublic'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        409:
          description: "- `no_agents`: Outside the opening hours, or nobody reachable serves the topic: show the offline form.\n- `conversation_exists`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoAgents'
                  -
                    $ref: '#/components/schemas/ErrorConversationExists'
        422:
          description: '`validation_failed`: The category is unknown, inactive or not on this widget (`details.category`), or a pre-chat rule failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  description: "Slug of the topic the visitor picked (one of the widget's categories, see the config call). Must not be greater than 100 characters."
                  example: billing
                message:
                  type: string
                  description: 'Optional first message; it becomes message 1 of the chat. Must not be greater than 4000 characters.'
                  example: 'Hi, I need help with my invoice.'
                  nullable: true
                name:
                  type: string
                  description: "Pre-chat answer. Whether it is required follows the widget's pre-chat setup, enforced here; a field the widget has switched off is ignored."
                  example: 'Ada Lovelace'
                  nullable: true
                email:
                  type: string
                  description: 'Pre-chat answer (see `name`).'
                  example: ada@example.com
                  nullable: true
                phone:
                  type: string
                  description: 'Pre-chat answer (see `name`).'
                  example: '+15551234567'
                  nullable: true
                consent:
                  type: boolean
                  description: 'Must be `true` when the widget shows a consent text.'
                  example: true
                  nullable: true
              required:
                - category
  '/api/v1/public/conversations/{ulid}/end':
    post:
      summary: 'End the chat'
      operationId: publicConversationsEnd
      description: "The visitor ends an active chat. `ratingRequested` becomes `true` and the rating window opens; on a widget whose `features.rating` is off the chat goes straight to `closed` (reason `skipped`).\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      responses:
        200:
          description: "A conversation as its visitor sees it (`ConversationPublic`, docs/contracts/realtime-events.md): the ulid, the human ticket number, status, topic and the agent's public face."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationPublic'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`feature_disabled`: The widget switched `endChatByVisitor` off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFeatureDisabled'
        404:
          description: "- `widget_not_found`\n- `not_found`: The id is not one of this visitor token's conversations (another visitor's is `404`, never `403`)."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorWidgetNotFound'
                  -
                    $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: '`conversation_not_active`: Also for a queued chat: cancel it instead.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConversationNotActive'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Conversation
    parameters:
      -
        in: path
        name: ulid
        description: "The ulid of the conversation. It must belong to the visitor token's session; another visitor's conversation is `404`."
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/public/conversations/{ulid}/cancel':
    post:
      summary: 'Cancel a waiting chat'
      operationId: publicConversationsCancel
      description: "The visitor leaves a `queued` chat: it becomes `closed` (reason `cancelled`).\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      responses:
        200:
          description: "A conversation as its visitor sees it (`ConversationPublic`, docs/contracts/realtime-events.md): the ulid, the human ticket number, status, topic and the agent's public face."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationPublic'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        404:
          description: "- `widget_not_found`\n- `not_found`: The id is not one of this visitor token's conversations (another visitor's is `404`, never `403`)."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorWidgetNotFound'
                  -
                    $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: '`conversation_not_queued`: An agent was first.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConversationNotQueued'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Conversation
    parameters:
      -
        in: path
        name: ulid
        description: "The ulid of the conversation. It must belong to the visitor token's session; another visitor's conversation is `404`."
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/public/attachments/{attachment}':
    get:
      summary: 'Download an image'
      operationId: publicAttachmentsShow
      description: "The target of the signed `url` / `thumbUrl` in message payloads. Do not send an `Authorization` header and never log the URL: its signature is the credential (valid `chat.attachment_url_ttl_minutes`, default 240, for exactly one attachment; `thumb=1` is part of the signature). The image is streamed from the private disk with its stored content type, `nosniff` and `Content-Security-Policy: default-src 'none'; sandbox`, under a neutral file name.\n\n**Access.** No bearer token: the URL's signature is the credential (it names exactly one attachment and expires).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      responses:
        200:
          description: 'The image bytes.'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        403:
          description: '`forbidden`: The signature is missing, altered, expired or belongs to another URL (or another `thumb` value).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorForbidden'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Messages & attachments'
      security: []
    parameters:
      -
        in: path
        name: attachment
        description: 'The ulid of the attachment.'
        example: 01j0ay932vvkjhp0dcv6p5r0j8
        required: true
        schema:
          type: string
  '/api/v1/public/conversations/{ulid}/attachments':
    post:
      summary: 'Upload an image'
      operationId: publicAttachmentsStore
      description: "Multipart upload of one image, then reference its `ulid` in the next message. Judged by content (`finfo`), never by name or declared type; SVG, HTML, PDF, scripts and polyglots are refused. The image is decoded and encoded again, so EXIF, XMP, comments and anything hidden in them do not survive; a 320 px thumbnail is made. An animated GIF is refused. Unreferenced uploads are deleted after 24 hours.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-upload`: 10 uploads a minute per visitor session, and the 600 a minute per client network ceiling."
      responses:
        201:
          description: 'An image attached to a message.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Attachment'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`feature_disabled`: The widget switched attachments off.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorFeatureDisabled'
        404:
          description: "- `widget_not_found`\n- `not_found`: The id is not one of this visitor token's conversations (another visitor's is `404`, never `403`)."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorWidgetNotFound'
                  -
                    $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: '`conversation_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConversationNotActive'
        422:
          description: "- `validation_failed`: Not an allowed image, an animated GIF, over the size or pixel limit, or 10 uploads already wait. The message is under `details.file`.\n- `attachment_quota_exceeded`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorValidationFailed'
                  -
                    $ref: '#/components/schemas/ErrorAttachmentQuotaExceeded'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Messages & attachments'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'One image: JPEG, PNG, WebP or a still GIF, within `limits.attachmentMaxBytes` (default 5 MB) and `attachmentMaxDimension` pixels. It is judged by its content, not its name or declared type; SVG, PDF, animated GIFs and anything else is refused. EXIF and other metadata do not survive (the image is re-encoded). Must be a file. Must not be greater than 5120 kilobytes.'
              required:
                - file
    parameters:
      -
        in: path
        name: ulid
        description: "The ulid of the conversation. It must belong to the visitor token's session; another visitor's conversation is `404`."
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/public/conversations/{ulid}/messages':
    get:
      summary: 'List messages'
      operationId: publicMessagesIndex
      description: "Messages after `after_seq`, ascending by `seq`, at most `limit`; `meta.next_cursor` is the `after_seq` of the next page, `null` at the end. Visitor-safe: agents appear as `{ type, name, avatarUrl }`, no ids or e-mail addresses. This is also the polling fallback when no websocket is available, and the gap sync after any reconnect: pass the highest `seq` you hold.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      parameters:
        -
          in: query
          name: after_seq
          description: 'Return the messages whose `seq` is greater than this (0 or absent: from the start). After a reconnect pass the last `seq` you hold. Must be at least 0. Must not be greater than 2147483647.'
          example: 14
          required: false
          schema:
            type: integer
            nullable: true
        -
          in: query
          name: limit
          description: 'Page size, default 100, at most 200. Must be at least 1. Must not be greater than 200.'
          example: 100
          required: false
          schema:
            type: integer
            nullable: true
      responses:
        200:
          description: 'A page of messages.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Opaque cursor of the next page: pass it as `cursor`. `null` on the last page.'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
