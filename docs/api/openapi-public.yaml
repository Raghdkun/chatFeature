      description: "Creates a one-time code and a `https://wa.me/<number>?text=...` link that opens WhatsApp with it typed in; when the visitor sends it, the WhatsApp chat is linked to their widget visitor. A visitor who asks again while their code for the same topic is still live gets it back with `200` (one live ticket per visitor and topic). The code has 8 characters from `ABCDEFGHJKMNPQRSTUVWXYZ23456789` and lives `whatsapp.handoff_ttl_minutes`.\n\n`{key}` must be the token's own widget (anything else is the same `404 widget_not_found` an unknown key gets). Besides the per-visitor limits the number of LIVE codes is capped per client network and widget (30) and per widget (500); `Retry-After` is when the first of them expires.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute).\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `wa-handoff`: 6 a minute per visitor, 20 per client network, 10 per widget and network and 120 per widget (plus the live-code caps described on the endpoint)."
      responses:
        200:
          description: "The visitor's live code for this topic."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Handoff'
        201:
          description: 'A new code.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Handoff'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `origin_not_allowed`\n- `feature_disabled`: The widget's `features.whatsapp` or the global switch is off."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorOriginNotAllowed'
                  -
                    $ref: '#/components/schemas/ErrorFeatureDisabled'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        409:
          description: '`whatsapp_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWhatsappUnavailable'
        422:
          description: '`validation_failed`: `details.category`.'
