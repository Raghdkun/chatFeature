        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_msg_id:
                  type: string
                  description: 'A ULID the client makes up. Sending the same id again returns the original message with `200` instead of storing a duplicate: retry a failed request safely.'
                  example: 01j9z3q8x7m5n2k4p6r8t0v1w3
                  nullable: true
                body:
                  type: string
                  description: 'Plain text, at most `limits.maxMessageLength` characters (default 4000). Required unless `attachments` is given. This field is required when <code>attachments</code> is not present. Must not be greater than 4000 characters.'
                  example: 'Are you there?'
                  nullable: true
                attachments:
                  type: array
                  description: 'Ulid of an uploaded image.'
                  example:
                    - 01j0ay932vvkjhp0dcv6p5r0j8
                  items:
                    type: string
    parameters:
      -
        in: path
        name: ulid
        description: "The ulid of the conversation. It must belong to the visitor token's session; another visitor's conversation is `404`."
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/public/conversations/{ulid}/receipts':
