  /widget/v1/loader.js:
    get:
      summary: 'Generic loader script'
      operationId: embedLoader
      description: '`GET /widget/v1/loader.js`: one script for every widget; it reads `data-widget-key` from its own tag and fetches the config from the public API. When `public/widget/v1/loader.js` exists the web server serves that file itself.'
      responses:
        200:
          description: 'The script.'
          content:
            text/plain:
              schema:
                type: string
                example: "/* PNE Chat loader */\n"
      tags:
        - 'Widget delivery'
      security: []
