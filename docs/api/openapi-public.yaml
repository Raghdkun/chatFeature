    Session:
      type: object
      description: 'The answer of `POST /public/widgets/{key}/sessions` (inside `{ data }`): the plaintext token (shown once), when it expires, the open chat that was resumed (or null), the websocket endpoint (null when Reverb is not configured: the panel stays on REST) and the limits the panel checks client-side before it sends anything.'
      required:
        - visitorToken
        - expiresAt
        - conversation
        - ws
        - limits
      properties:
        visitorToken:
          type: string
          description: 'The visitor bearer token (`vt_` + 40 characters). Shown once; only its sha256 is stored. Keep it out of URLs and logs.'
        expiresAt:
          type: string
          format: date-time
          description: 'When the token stops working (`chat.visitor_session_ttl_days`).'
        conversation:
          allOf:
            -
              $ref: '#/components/schemas/ConversationPublic'
          description: 'The still-open live chat that was resumed with this session, or `null`.'
          nullable: true
        ws:
          allOf:
            -
              $ref: '#/components/schemas/RealtimeEndpoint'
          description: 'Where to open the websocket (Reverb, Pusher protocol); `null` when realtime is not configured, then stay on REST polling.'
          nullable: true
        limits:
          allOf:
            -
              $ref: '#/components/schemas/SessionLimits'
          description: 'The effective limits, for client-side checks. The server enforces them all.'
