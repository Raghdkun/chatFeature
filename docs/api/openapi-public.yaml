      description: "`GET /c/{key}`: the panel as a standalone page; it sends `frame-ancestors 'none'`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute)."
      responses:
        200:
          description: 'The page.'
          content:
            text/plain:
