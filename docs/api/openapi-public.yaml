        - 'WhatsApp hand-off'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  description: 'Slug of the topic the visitor picked (optional). One live code per visitor and topic. Must match the regex /^[a-z0-9][a-z0-9-]*$/D. Must not be greater than 100 characters.'
                  example: billing
                  nullable: true
    parameters:
      -
        in: path
        name: key
        description: "The widget's public key (`wk_` + 20 lower-case letters and digits)."
        example: wk_k3j9x2m5n8p4q7r1s6t0
        required: true
        schema:
          type: string
  /api/v1/public/broadcasting/auth:
    post:
      summary: 'Authorise a visitor channel'
      operationId: publicBroadcastingAuth
      description: "The Pusher channel authorisation of a VISITOR, exactly what `pusher-js` posts (form or JSON fields `socket_id` and `channel_name`) with the visitor bearer in `authEndpoint` headers. It signs **only** `private-conversation.{ulid}` of the conversation the session is bound to (the ulid spelled lower case, as events are published); anything else is `403 channel_forbidden`, never `404`, because a Pusher client treats any non-200 as a refusal. The signature comes from the configured broadcaster (the Reverb app secret never leaves the server); the answer is `Cache-Control: no-store` and sets no cookie.\n\nConnect to the host, port and scheme of `ws` from the session answer with the app `key`. `503 realtime_unavailable` means Reverb is not configured: stay on REST polling.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `broadcasting-auth`: 30 a minute per token and 120 per client network."
      responses:
        200:
          description: 'The signed channel authorisation: `<app key>:<signature>`.'
          content:
            application/json:
              schema:
                type: object
                example:
                  auth: 'f1a2b3c4d5e6f7a8b9c0:3b1f0c9e5a7d2e4f6a8b0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7'
                properties:
                  auth:
                    type: string
                    example: 'f1a2b3c4d5e6f7a8b9c0:3b1f0c9e5a7d2e4f6a8b0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`channel_forbidden`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorChannelForbidden'
        404:
          description: '`widget_not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorWidgetNotFound'
        422:
          description: '`validation_failed`: A malformed `socket_id` or `channel_name`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`realtime_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRealtimeUnavailable'
      tags:
        - Realtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                socket_id:
                  type: string
                  description: 'The socket id Reverb gave the connection (`<digits>.<digits>`).'
                  example: '123456.7890123'
                channel_name:
                  type: string
                  description: "Must be `private-conversation.` + the ulid of the session's conversation."
                  example: private-conversation.01j9z3q8x7m5n2k4p6r8t0v1w2
              required:
                - socket_id
                - channel_name
  '/w/{key}.js':
    get:
      summary: 'Widget script'
      operationId: embedScript
      description: "`GET /w/{key}.js`: the loader bundle with the boot config inlined, for a `<script async src=...>` tag. Not under `/api`, no session and no cookies; `ETag`, `Cache-Control: public, max-age=60, stale-while-revalidate=300`, `X-Content-Type-Options: nosniff`, `Vary: Referer`. A script tag cannot be CORS-gated, so this is the one place that looks at the `Referer`: an origin that is not on the widget's domain list gets `403`, no `Referer` is served. Errors are plain text or HTML, not the JSON envelope.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute)."
      responses:
        200:
          description: 'The script.'
          content:
            text/plain:
              schema:
                type: string
                example: "/* PNE Chat loader + boot config */\n"
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Widget delivery'
      security: []
    parameters:
      -
        in: path
        name: key
        description: "The widget's public key (`wk_` + 20 lower-case letters and digits)."
        example: wk_k3j9x2m5n8p4q7r1s6t0
        required: true
        schema:
          type: string
  '/embed/{key}':
    get:
      summary: 'Chat panel page (iframe)'
      operationId: embedFrame
      description: "`GET /embed/{key}[?mode=inline]`: the Blade shell of the React chat panel, to be put in an iframe. `Content-Security-Policy: frame-ancestors <widget domains>` (`'none'` when the list is empty), no cookies. `?preview=1` is for signed-in administrators only (the builder preview).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-config`: 600 calls a minute per client network across all widget keys (counted before the key is looked up; lookups of unknown keys are limited harder, 60 a minute)."
      responses:
        200:
          description: 'The panel page.'
          content:
            text/plain:
              schema:
                type: string
                example: "<!doctype html>\n<html>...</html>\n"
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Widget delivery'
      security: []
    parameters:
      -
        in: path
        name: key
        description: "The widget's public key (`wk_` + 20 lower-case letters and digits)."
        example: wk_k3j9x2m5n8p4q7r1s6t0
        required: true
        schema:
          type: string
  '/c/{key}':
    get:
