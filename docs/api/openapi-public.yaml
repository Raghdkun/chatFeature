                type: integer
      tags:
        - 'Messages & attachments'
    post:
      summary: 'Send a message'
      operationId: publicMessagesStore
      description: "Only an `active` live chat takes messages. Send a `client_msg_id` (a ULID you make up) so a retry is safe: a repeat answers `200` with the original message, also after the chat ended.\n\n**Access.** Visitor bearer token (`Authorization: Bearer vt_...`) from the session call. Only the token's own session and conversations are reachable; anything else is `404`.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `public-network`: 600 visitor calls a minute per client network, counted before the token is looked up.\n- `public-message`: 240 calls a minute per visitor session (**30 for message sends**) and 600 per client network; starting a chat is also limited per widget and network (3) and per widget (120)."
      responses:
        200:
          description: 'A repeat of a `client_msg_id` already stored: the original message.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        201:
          description: 'The message was stored.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          description: "- `unauthenticated`: No or an unknown visitor token.\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        404:
          description: "- `widget_not_found`\n- `not_found`: The id is not one of this visitor token's conversations (another visitor's is `404`, never `403`)."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorWidgetNotFound'
                  -
                    $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: '`conversation_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConversationNotActive'
        422:
          description: "`validation_failed`: Neither `body` nor `attachments`, a body over the limit, more than 5 attachments, or an attachment that is not this conversation's upload."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
