openapi: 3.0.3
info:
  title: 'PNE Chat Public (visitor) API'
  description: 'REST API for visitor chat clients: widget config, sessions, chat, messages, attachments, rating, offline tickets and WhatsApp hand-off. Bearer visitor token, no cookies.'
  version: v1
  contact:
    name: 'PNE Chat'
  license:
    name: Proprietary
servers:
  -
    url: 'https://chat.example.com'
tags:
  -
    name: 'Widget config'
    description: 'What a visitor client needs before it starts: the published configuration and the live availability. Cacheable, origin-checked.'
  -
    name: Sessions
    description: 'A visitor session is the `vt_...` bearer token every other call carries.'
  -
    name: Conversation
    description: "Starting, reading, ending and cancelling the visitor's chat. A visitor never lists history: at most one open live chat."
  -
    name: 'Messages & attachments'
    description: 'Reading and writing the messages of a conversation, image uploads, read receipts and typing.'
  -
    name: Rating
    description: "The visitor's answer to the rating prompt after a chat ended."
  -
    name: 'Offline tickets'
    description: 'The offline form: a separate ticket when nobody is available.'
  -
    name: 'WhatsApp hand-off'
    description: 'Continue the conversation in WhatsApp: a code and a `wa.me` link.'
  -
    name: Realtime
    description: "Authorisation of the visitor's websocket channel (Pusher protocol, served by Laravel Reverb)."
  -
    name: 'Widget delivery'
    description: 'Not JSON APIs: the script, iframe page and hosted page a custom front end can embed or build on.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'The visitor token `vt_...` from `POST /widgets/{key}/sessions`.'
  schemas:
    AgentRef:
      type: object
      description: 'The agent as a visitor sees them: display name and avatar only.'
      required:
        - name
        - avatarUrl
      properties:
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
      example:
        name: 'Sam Rivera'
        avatarUrl: 'https://chat.example.com/storage/avatars/sam.jpg'
    Attachment:
      type: object
      description: 'An image attached to a message.'
      required:
        - ulid
        - mime
        - size
        - width
        - height
        - url
        - thumbUrl
      properties:
        ulid:
          type: string
        mime:
          type: string
        size:
          type: integer
          description: 'Bytes of the stored (re-encoded) image.'
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        url:
          type: string
          description: 'Short-lived signed URL (`chat.attachment_url_ttl_minutes`, default 240). The signature is the credential: send no `Authorization` header with it and never log it.'
        thumbUrl:
          type: string
          description: 'The 320 px thumbnail, signed the same way.'
          nullable: true
      example:
        ulid: 01j0jbdbac9228nyw65ghr7fhn
        mime: image/jpeg
        size: 48213
        width: 1280
        height: 720
        url: 'https://chat.example.com/api/v1/public/attachments/01j0ay932vvkjhp0dcv6p5r0j8?expires=1790000000&signature=4f2a9c'
        thumbUrl: 'https://chat.example.com/api/v1/public/attachments/01j0ay932vvkjhp0dcv6p5r0j8?thumb=1&expires=1790000000&signature=7be1d3'
    Availability:
      type: object
      description: 'Whether a widget can take chats right now (docs/contracts/rest-shapes.md).'
      required:
        - online
        - openNow
        - nextOpenAt
        - categories
        - whatsapp
      properties:
        online:
          type: boolean
        openNow:
          type: boolean
        nextOpenAt:
          type: string
          format: date-time
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAvailability'
        whatsapp:
          $ref: '#/components/schemas/WhatsappAvailability'
      example:
        online: true
        openNow: true
        nextOpenAt: '2026-09-30T12:00:00.000Z'
        categories:
          -
            slug: billing
            online: true
        whatsapp:
          enabled: true
    BootApi:
      type: object
      description: 'Where the loader talks to: public API base, the iframe page and the postMessage origin to trust.'
      required:
        - base
        - embed
        - appOrigin
      properties:
        base:
          type: string
        embed:
          type: string
        appOrigin:
          type: string
      example:
        base: 'https://chat.example.com/api/v1/public'
        embed: 'https://chat.example.com/embed/wk_k3j9x2m5n8p4q7r1s6t0'
        appOrigin: 'https://chat.example.com'
    BootCategory:
      type: object
      description: "A category a visitor may pick (already filtered to the widget's enabled, active categories)."
      required:
        - slug
        - label
        - description
        - icon
        - color
      properties:
        slug:
          type: string
        label:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
      example:
        slug: billing
        label: Billing
        description: 'Questions about invoices, payments and refunds.'
        icon: message-circle
        color: '#0ea5e9'
    BootGreeting:
      type: object
      description: "One greeting of the pool as the loader sees it (`id` is the greeting's ulid; `body` is plain text)."
      required:
        - id
        - body
        - agentName
        - agentAvatarUrl
        - locale
        - weight
      properties:
        id:
          type: string
        body:
          type: string
        agentName:
          type: string
          nullable: true
        agentAvatarUrl:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        weight:
          type: integer
      example:
        id: 01j2f3fck3zr8cwg62eq61nmgp
        body: 'Hi! Need a hand?'
        agentName: Sam
        agentAvatarUrl: 'https://chat.example.com/storage/avatars/sam.jpg'
        locale: en
        weight: 1
    CategoryAvailability:
      type: object
      description: 'Per-category availability inside AvailabilityData.'
      required:
        - slug
        - online
      properties:
        slug:
          type: string
        online:
          type: boolean
      example:
        slug: billing
        online: true
    CategoryRef:
      type: object
      description: 'A category as chat payloads name it: its slug and the label to show (`{slug, label}`, docs/contracts/realtime-events.md).'
      required:
        - slug
        - label
      properties:
        slug:
          type: string
        label:
          type: string
      example:
        slug: billing
        label: Billing
    ConversationPublic:
      type: object
      description: "A conversation as its visitor sees it (`ConversationPublic`, docs/contracts/realtime-events.md): the ulid, the human ticket number, status, topic and the agent's public face."
      required:
        - ulid
        - ticketNo
        - status
        - type
        - category
        - agent
        - createdAt
        - endedAt
        - ratingRequested
        - lastSeq
      properties:
        ulid:
          type: string
          description: 'Public id of the conversation.'
        ticketNo:
          type: string
          description: 'Short ticket number the visitor can quote and staff can search by.'
        status:
          type: string
          enum:
            - queued
            - active
            - ended
            - closed
            - missed
          description: '`queued` (waiting for an agent), `active`, `ended` (the rating window is open), `closed`, `missed` (nobody accepted in time).'
        type:
          type: string
          enum:
            - live
            - offline
          description: '`live` chat or `offline` ticket.'
        category:
          allOf:
            -
              $ref: '#/components/schemas/CategoryRef'
          description: 'The topic the visitor chose; `null` for an offline ticket without one.'
          nullable: true
        agent:
          allOf:
            -
              $ref: '#/components/schemas/AgentRef'
          description: "The agent's public face (name and avatar) once someone accepted; `null` while queued."
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: 'ISO-8601 UTC with milliseconds.'
        endedAt:
          type: string
          format: date-time
          description: 'When the chat ended or closed; `null` while it is running.'
          nullable: true
        ratingRequested:
          type: boolean
          description: 'True while the rating prompt is open (status `ended` on a widget that rates chats).'
        lastSeq:
          type: integer
          description: 'Number (`seq`) of the newest message. After a reconnect ask for `after_seq` = the last `seq` you hold.'
      example:
        ulid: 01j9z3q8x7m5n2k4p6r8t0v1w2
        ticketNo: X4BWQW
        status: active
        type: live
        category:
          slug: billing
          label: Billing
        agent:
          name: 'Sam Rivera'
          avatarUrl: 'https://chat.example.com/storage/avatars/sam.jpg'
        createdAt: '2026-09-30T12:00:00.000Z'
        endedAt: null
        ratingRequested: false
        lastSeq: 14
    FeaturesConfig:
      type: object
      description: '`config.features`: switches the dashboard controls (clients may only turn a feature off, never on).'
      required:
        - attachments
        - rating
        - sounds
        - preChat
        - whatsapp
        - offlineForm
        - titleBadge
        - endChatByVisitor
        - poweredBy
      properties:
        attachments:
          type: boolean
        rating:
          type: boolean
        sounds:
          type: boolean
        preChat:
          type: boolean
        whatsapp:
          type: boolean
        offlineForm:
          type: boolean
        titleBadge:
          type: boolean
        endChatByVisitor:
          type: boolean
        poweredBy:
          type: boolean
      example:
        attachments: true
        rating: true
        sounds: true
        preChat: true
        whatsapp: true
        offlineForm: true
        titleBadge: true
        endChatByVisitor: true
        poweredBy: true
    GreetingsConfig:
      type: object
      description: '`config.greetings`: scheduling of the greeting popup.'
      required:
        - enabled
        - onPageLoad
        - delaySeconds
        - intervalMinutes
        - autoHideSeconds
        - dismissPolicy
        - showAgent
      properties:
        enabled:
          type: boolean
        onPageLoad:
          type: boolean
        delaySeconds:
          type: integer
        intervalMinutes:
          type: integer
        autoHideSeconds:
          type: integer
        dismissPolicy:
          type: string
          enum:
            - session
            - interval
            - never
        showAgent:
          type: boolean
      example:
        enabled: true
        onPageLoad: true
        delaySeconds: 3
        intervalMinutes: 30
        autoHideSeconds: 12
        dismissPolicy: session
        showAgent: true
    Handoff:
      type: object
      description: 'The response of the public hand-off call (`POST /api/v1/public/widgets/{key}/whatsapp-handoff`): the code the visitor sends, the `https://wa.me/<number>?text=...` link that opens WhatsApp with it typed in, and when it stops working.'
      required:
        - code
        - waUrl
        - expiresAt
        - ttlSeconds
      properties:
        code:
          type: string
          description: 'The 8-character code the visitor sends in WhatsApp.'
        waUrl:
          type: string
          description: '`https://wa.me/<number>?text=...`: opens WhatsApp with the code typed in.'
        expiresAt:
          type: string
          format: date-time
          description: 'When the code stops linking a chat.'
        ttlSeconds:
          type: integer
          description: "Whole seconds left when the answer was built. Count down from your own arrival time with this instead of comparing `expiresAt` with the visitor's clock."
      example:
        code: K7M2Q9XA
        waUrl: 'https://wa.me/15551234567?text=Hi%2C%20my%20code%20is%20K7M2Q9XA'
        expiresAt: '2026-09-30T12:30:00.000Z'
        ttlSeconds: 540
    Holiday:
      type: object
      description: "A closed day (`date` is `YYYY-MM-DD` in the widget's timezone; `label` is `''` when the admin gave none, never null)."
      required:
        - date
        - label
      properties:
        date:
          type: string
        label:
          type: string
      example:
        date: '2026-12-25'
        label: 'Christmas Day'
    HoursConfig:
      type: object
      description: '`config.hours`.'
      required:
        - mode
        - timezone
        - schedule
        - holidays
      properties:
        mode:
          type: string
          enum:
            - auto_hours
            - always_online
            - always_offline
        timezone:
          type: string
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRange'
        holidays:
          type: array
          items:
            $ref: '#/components/schemas/Holiday'
      example:
        mode: auto_hours
        timezone: Europe/Berlin
        schedule:
          -
            day: 1
            start: '09:00'
            end: '17:00'
        holidays:
          -
            date: '2026-12-25'
            label: 'Christmas Day'
    LauncherConfig:
      type: object
      description: '`config.launcher`: the bubble or pill that opens the panel.'
      required:
        - style
        - icon
        - iconUrl
        - label
        - avatarUrl
      properties:
        style:
          type: string
          enum:
            - bubble
            - pill
        icon:
          type: string
          enum:
            - chat
            - help
            - sparkle
            - custom
        iconUrl:
          type: string
          nullable: true
        label:
          type: string
        avatarUrl:
          type: string
          nullable: true
      example:
        style: bubble
        icon: chat
        iconUrl: null
        label: 'Chat with us'
        avatarUrl: null
    Message:
      type: object
      description: 'A chat message exactly as `docs/contracts/realtime-events.md` defines `Message` (REST + `message.created`).'
      required:
        - ulid
        - seq
        - conversation
        - sender
        - type
        - body
        - attachments
        - clientMsgId
        - createdAt
        - deliveredAt
        - seenAt
      properties:
        ulid:
          type: string
        seq:
          type: integer
          description: 'Per-conversation, monotonic message number: order messages by it and detect gaps with it.'
        conversation:
          type: string
          description: 'Ulid of the conversation.'
        sender:
          $ref: '#/components/schemas/MessageSender'
        type:
          type: string
          enum:
            - text
            - image
            - system
          description: '`text`, `image` (attachments only) or `system` (a line such as "Sam joined the chat.").'
        body:
          type: string
          description: 'Plain text (never HTML); `null` for an image-only message.'
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: 'Images in the order the sender posted them.'
        clientMsgId:
          type: string
          description: 'The client-made ULID the sender attached (idempotency key), echoed back; `null` for server-made lines.'
          nullable: true
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          description: "When the other side's client reported receiving the message."
          nullable: true
        seenAt:
          type: string
          format: date-time
          description: 'When the other side reported reading it.'
          nullable: true
      example:
        ulid: 01j9z3qa4b6c8d0e2f4g6h8jkm
        seq: 14
        conversation: 01j9z3q8x7m5n2k4p6r8t0v1w2
        sender:
          type: agent
          name: 'Sam Rivera'
          avatarUrl: 'https://chat.example.com/storage/avatars/sam.jpg'
          id: 7
        type: text
        body: 'Hello, how can I help you today?'
        attachments:
          -
            ulid: 01j0jbdbac9228nyw65ghr7fhn
            mime: image/jpeg
            size: 48213
            width: 1280
            height: 720
            url: 'https://chat.example.com/api/v1/public/attachments/01j0ay932vvkjhp0dcv6p5r0j8?expires=1790000000&signature=4f2a9c'
            thumbUrl: 'https://chat.example.com/api/v1/public/attachments/01j0ay932vvkjhp0dcv6p5r0j8?thumb=1&expires=1790000000&signature=7be1d3'
        clientMsgId: 01jvyybs275eqqmdnfnjg426yb
        createdAt: '2026-09-30T12:00:00.000Z'
        deliveredAt: '2026-09-30T12:04:35.000Z'
        seenAt: null
    MessageSender:
      type: object
      description: 'Who wrote a message.'
      required:
        - type
        - name
        - avatarUrl
      properties:
        type:
          type: string
          enum:
            - visitor
            - agent
            - system
          description: '`visitor`, `agent` or `system`.'
        name:
          type: string
          description: 'Display name; `null` for system lines.'
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        id:
          type: integer
          description: 'Staff user id of an agent sender. Present in staff payloads only: for visitors the key is absent.'
      example:
        type: agent
        name: 'Sam Rivera'
        avatarUrl: 'https://chat.example.com/storage/avatars/sam.jpg'
        id: 7
    PreChatConfig:
      type: object
      description: '`config.preChat`: the form shown before a chat starts.'
      required:
        - fields
        - consentText
      properties:
        fields:
          $ref: '#/components/schemas/PreChatFields'
        consentText:
          type: string
          nullable: true
      example:
        fields:
          name:
            enabled: true
            required: true
          email:
            enabled: true
            required: true
          phone:
            enabled: true
            required: true
        consentText: 'I agree that my messages are stored to answer my request.'
    PreChatField:
      type: object
      description: 'One pre-chat form field.'
      required:
        - enabled
        - required
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
      example:
        enabled: true
        required: true
    PreChatFields:
      type: object
      description: '`config.preChat.fields`.'
      required:
        - name
        - email
        - phone
      properties:
        name:
          $ref: '#/components/schemas/PreChatField'
        email:
          $ref: '#/components/schemas/PreChatField'
        phone:
          $ref: '#/components/schemas/PreChatField'
      example:
        name:
          enabled: true
          required: true
        email:
          enabled: true
          required: true
        phone:
          enabled: true
          required: true
    PublicWidgetConfig:
      type: object
      description: 'The part of the config visitors receive: everything except the server-side policy blocks (`routing.*`, `session.*`).'
      required:
        - v
        - defaultLocale
        - localeDetect
        - theme
        - launcher
        - texts
        - features
        - preChat
        - greetings
        - hours
      properties:
        v:
          type: integer
        defaultLocale:
          type: string
        localeDetect:
          type: boolean
        theme:
          $ref: '#/components/schemas/ThemeConfig'
        launcher:
          $ref: '#/components/schemas/LauncherConfig'
        texts:
          type: object
          additionalProperties: true
        features:
          $ref: '#/components/schemas/FeaturesConfig'
        preChat:
          $ref: '#/components/schemas/PreChatConfig'
        greetings:
          $ref: '#/components/schemas/GreetingsConfig'
        hours:
          $ref: '#/components/schemas/HoursConfig'
      example:
        v: 1
        defaultLocale: en
        localeDetect: true
        theme:
          mode: auto
          primary: '#0ea5e9'
          primaryText: '#ffffff'
          accent: '#f59e0b'
          surface: '#ffffff'
          text: '#0f172a'
          fontFamily: 'Inter, system-ui, sans-serif'
          fontUrl: null
          radius: 16
          shadow: none
          launcherSize: sm
          panelWidth: 380
          panelHeight: 640
          position: bottom-right
          offsetX: 20
          offsetY: 20
          zIndex: 2147483000
        launcher:
          style: bubble
          icon: chat
          iconUrl: null
          label: 'Chat with us'
          avatarUrl: null
        texts:
          en:
            title: 'Chat with us'
            send: Send
        features:
          attachments: true
          rating: true
          sounds: true
          preChat: true
          whatsapp: true
          offlineForm: true
          titleBadge: true
          endChatByVisitor: true
          poweredBy: true
        preChat:
          fields:
            name:
              enabled: true
              required: true
            email:
              enabled: true
              required: true
            phone:
              enabled: true
              required: true
          consentText: 'I agree that my messages are stored to answer my request.'
        greetings:
          enabled: true
          onPageLoad: true
          delaySeconds: 3
          intervalMinutes: 30
          autoHideSeconds: 12
          dismissPolicy: session
          showAgent: true
        hours:
          mode: auto_hours
          timezone: Europe/Berlin
          schedule:
            -
              day: 1
              start: '09:00'
              end: '17:00'
          holidays:
            -
              date: '2026-12-25'
              label: 'Christmas Day'
    Rating:
      type: object
      description: "A visitor's rating of a conversation (`conversation` is its ulid)."
      required:
        - conversation
        - score
        - comment
        - createdAt
      properties:
        conversation:
          type: string
          description: 'Ulid of the rated conversation.'
        score:
          type: integer
          description: '1 to 5.'
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      example:
        conversation: 01j9z3q8x7m5n2k4p6r8t0v1w2
        score: 5
        comment: 'Quick and helpful, thank you.'
        createdAt: '2026-09-30T12:00:00.000Z'
    RealtimeEndpoint:
      type: object
      description: 'Where the visitor panel opens its websocket (`ws` of the session answer): the public Reverb key and address, never a secret.'
      required:
        - key
        - host
        - port
        - scheme
      properties:
        key:
          type: string
          description: 'The public Reverb app key (the Pusher `key`); never a secret.'
        host:
          type: string
          description: 'Public host to connect to.'
        port:
          type: integer
          description: 'Public port.'
        scheme:
          type: string
          description: '`https` means `wss://`, `http` means `ws://`.'
      example:
        key: f1a2b3c4d5e6f7a8b9c0
        host: chat.example.com
        port: 443
        scheme: https
    ResolvedBootConfig:
      type: object
      description: 'What `/w/{key}.js` inlines and `GET /api/v1/public/widgets/{key}/config` returns (docs/contracts/widget-config.md): the published config plus greetings, enabled categories, availability and the `api` block.'
      required:
        - v
        - key
        - configVersion
        - generatedAt
        - locale
        - api
        - config
        - greetings
        - categories
        - availability
      properties:
        v:
          type: integer
        key:
          type: string
        configVersion:
          type: integer
        generatedAt:
          type: string
          format: date-time
        locale:
          type: string
        api:
          $ref: '#/components/schemas/BootApi'
        config:
          $ref: '#/components/schemas/PublicWidgetConfig'
        greetings:
          type: array
          items:
            $ref: '#/components/schemas/BootGreeting'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BootCategory'
        availability:
          $ref: '#/components/schemas/Availability'
      example:
        v: 1
        key: wk_k3j9x2m5n8p4q7r1s6t0
        configVersion: 3
        generatedAt: '2026-09-30T12:00:00.000Z'
        locale: en
        api:
          base: 'https://chat.example.com/api/v1/public'
          embed: 'https://chat.example.com/embed/wk_k3j9x2m5n8p4q7r1s6t0'
          appOrigin: 'https://chat.example.com'
        config:
          v: 1
          defaultLocale: en
          localeDetect: true
          theme:
            mode: auto
            primary: '#0ea5e9'
            primaryText: '#ffffff'
            accent: '#f59e0b'
            surface: '#ffffff'
            text: '#0f172a'
            fontFamily: 'Inter, system-ui, sans-serif'
            fontUrl: null
            radius: 16
            shadow: none
            launcherSize: sm
            panelWidth: 380
            panelHeight: 640
            position: bottom-right
            offsetX: 20
            offsetY: 20
            zIndex: 2147483000
          launcher:
            style: bubble
            icon: chat
            iconUrl: null
            label: 'Chat with us'
            avatarUrl: null
          texts:
            en:
              title: 'Chat with us'
              send: Send
          features:
            attachments: true
            rating: true
            sounds: true
            preChat: true
