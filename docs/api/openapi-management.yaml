          in: query
          name: limit
          description: 'Page size, default 50, at most 100. Must be at least 1. Must not be greater than 100.'
          example: 50
          required: false
          schema:
            type: integer
            nullable: true
        -
          in: query
          name: cursor
          description: 'The opaque `meta.next_cursor` of the previous page. Must not be greater than 200 characters.'
          example: eyJsYXN0Ijoi...
          required: false
          schema:
            type: string
            nullable: true
      responses:
        200:
          description: 'A page of chats.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaChat'
                  meta:
                    type: object
                    required:
                      - next_cursor
                      - unread_chats
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Opaque cursor of the next page: pass it as `cursor`. `null` on the last page.'
                      unread_chats:
                        type: integer
                        nullable: false
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not an active administrator."
