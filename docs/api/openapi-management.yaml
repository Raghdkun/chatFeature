  '/api/v1/whatsapp/chats/{chat}/messages':
    get:
      summary: 'List the messages of a WhatsApp chat'
      operationId: whatsappChatsMessagesIndex
      description: "A transcript page, always oldest first. Neither cursor = the newest page; `after_id` is the sync call after a reconnect; `before_id` the page before. `next_cursor` is the `after_id` of the following page (`null` at the newest end), `prev_cursor` the `before_id` of the previous one (`null` at the start).\n\n**Access.** Administrators only (agents get `403`; nothing says that WhatsApp exists).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      parameters:
        -
          in: query
          name: after_id
          description: 'Message ulid: the page after it (oldest first), the sync call after a reconnect. Not with `before_id`.'
          example: 01jcpyz1ssnda3sd58hdrej54g
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: before_id
          description: 'Message ulid: the page before it.'
          example: 01jcpyz1ssnda3sd58hdrej54g
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: limit
          description: 'Page size, default 100, at most 200. Must be at least 1. Must not be greater than 200.'
          example: 100
          required: false
          schema:
            type: integer
            nullable: true
      responses:
        200:
          description: 'A page of messages.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WaMessage'
                  meta:
                    type: object
                    required:
                      - next_cursor
                      - prev_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Opaque cursor of the next page: pass it as `cursor`. `null` on the last page.'
                      prev_cursor:
                        type: string
                        nullable: true
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not an active administrator."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        422:
          description: '`validation_failed`: An unknown or foreign message ulid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'WhatsApp (admin only)'
    post:
      summary: 'Reply in a WhatsApp chat'
      operationId: whatsappChatsMessagesStore
      description: "The message is stored `pending` and queued; a worker sends it (`sent`, then `delivered` / `read` / `failed` as the gateway's acks arrive). A repeated `client_msg_id` answers `200` with the original. The application protects the number: `reply_only_to_inbound`, a minimum interval between sends (a request that arrives too early is not refused, its job waits for its slot) and a daily cap per session.\n\n**Access.** Administrators only (agents get `403`; nothing says that WhatsApp exists).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: 'A repeat of a `client_msg_id`: the original.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WaMessage'
        201:
          description: 'Stored and queued (`pending`).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/WaMessage'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not an active administrator."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: "- `session_not_ready`\n- `reply_not_allowed`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorSessionNotReady'
                  -
                    $ref: '#/components/schemas/ErrorReplyNotAllowed'
        422:
          description: '`validation_failed`: The body is empty after cleaning or too long.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: "- `rate_limited`\n- `daily_cap_reached`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorRateLimited'
                  -
                    $ref: '#/components/schemas/ErrorDailyCapReached'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: "- `auth_unavailable`\n- `queue_unavailable`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorAuthUnavailable'
                  -
                    $ref: '#/components/schemas/ErrorQueueUnavailable'
      tags:
        - 'WhatsApp (admin only)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: 'Plain text, 1 to 4096 characters after cleaning (control and bidi characters are dropped). Must not be greater than 8192 characters.'
                  example: 'Thanks, we are looking into it.'
                client_msg_id:
                  type: string
                  description: 'Client-made ULID: a repeat returns the original with `200`.'
                  example: 01j9z3q8x7m5n2k4p6r8t0v1w4
                  nullable: true
              required:
                - body
    parameters:
      -
        in: path
        name: chat
        description: 'The ulid of the WhatsApp chat.'
        example: 01jhzxa0k0hkjytdbw4gs6eg49
        required: true
        schema:
          type: string
