  '/api/v1/conversations/{conversation}/transfer':
    post:
      summary: 'Transfer a chat'
      operationId: conversationsTransfer
      description: "Hands an active chat to a colleague (`agent_id`) or a topic (`category`). It returns to `queued` with the assignee cleared and the history kept. A category goes through the routing waves again (the agent who let go is not offered it); a colleague is the only one offered it and accepts it like any offer.\n\nA **live** chat is only handed to somebody who can take it now, otherwise `409 no_agents` with `details.target` and `details.reason` and the agent keeps the chat. See `GET .../transfer-targets` to check first.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: 'A conversation as staff see it (`ConversationStaff` = `ConversationPublic` + the extras below): visitor details, widget, assignee, unseen counter and timing.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConversationStaff'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not the assigned agent or an administrator."
          content:
            application/json:
              schema:
                oneOf:
