                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: "- `conversation_not_active`\n- `no_agents`: Nobody can take it: `details.target` is `agent` (`reason`: `offline`, `at_capacity`) or `category` (`reason`: `no_reachable_agent`)."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorConversationNotActive'
                  -
                    $ref: '#/components/schemas/ErrorNoAgents'
        422:
          description: '`validation_failed`: Neither or both of `agent_id` and `category`, or an unknown target.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
