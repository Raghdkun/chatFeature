  /api/v1/conversations:
    get:
      summary: 'List conversations'
      operationId: conversationsIndex
      description: "Newest first, cursor-paged. Visibility is decided by the server: an agent sees the chats assigned to them, the open offers while a chat is queued and queued offline tickets of the categories they serve; an administrator sees everything. WhatsApp chats are not conversations and never appear here.\n\nFilter by `status` (comma-separated), `category`, `widget`, `agent`, `type`, `q` and the creation time (`from`, `to`). `updated_after` is the incremental sync a client uses after a reconnect: ask for everything changed since the newest `updated` instant you hold and merge by `ulid`.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      parameters:
        -
          in: query
          name: status
          description: 'Comma-separated statuses: `queued`, `active`, `ended`, `closed`, `missed`. Must not be greater than 100 characters.'
          example: 'active,queued'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: category
          description: 'Category ulid or slug. Must not be greater than 100 characters.'
          example: billing
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: widget
          description: 'Widget ulid.'
          example: 01ja10epadeh9792bzqsvwt6xg
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: agent
          description: 'Assigned agent: a staff user id, or `me`. Must match the regex /^(?:me|[0-9]+)$/D. Must not be greater than 20 characters.'
          example: me
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: type
          description: '`live` chats or `offline` tickets.'
          example: live
          required: false
          schema:
            type: string
            enum:
              - live
              - offline
            nullable: true
        -
          in: query
          name: q
          description: "Search: part of the ticket number, the visitor's name, e-mail or phone, or message text (MySQL FULLTEXT: every word is a prefix and all are required; words under 3 characters use LIKE). Must not be greater than 200 characters."
          example: invoice
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: from
          description: 'Created at or after this instant (an offset like `+03:00` is honoured). Must be a valid date.'
          example: '2026-09-01T00:00:00Z'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: to
          description: 'Created at or before this instant. Must be a valid date.'
          example: '2026-09-30T23:59:59Z'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: updated_after
          description: 'Changed at or after this instant (inclusive, so a change in the second of your last sync is not lost; merge by ulid). The incremental sync after a reconnect. Must be a valid date.'
          example: '2026-09-30T12:00:00.000Z'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: limit
          description: 'Page size, default 25, at most 100. Must be at least 1. Must not be greater than 100.'
          example: 25
          required: false
          schema:
            type: integer
            nullable: true
        -
          in: query
          name: cursor
          description: 'The opaque `meta.next_cursor` of the previous page. Must not be greater than 500 characters.'
          example: eyJjb252ZXJzYXRpb25zLmlkIjo0MiwiX3BvaW50c1RvTmV4dEl0ZW1zIjp0cnVlfQ
          required: false
          schema:
            type: string
            nullable: true
      responses:
        200:
          description: 'A page of conversations.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationStaff'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Opaque cursor of the next page: pass it as `cursor`. `null` on the last page.'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        422:
          description: '`validation_failed`: A filter is invalid (an unknown status, a malformed date, a hand-made cursor).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Conversations
  /api/v1/conversations/queue:
    get:
      summary: 'List the waiting chats'
      operationId: conversationsQueue
      description: "Queued chats the caller can accept right now: their open offers and the offline tickets of their categories (an administrator sees all), oldest first, at most 200. Use `queueExpiresAt` to count down a live chat's remaining wait.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
