        -
          in: query
          name: status
          description: '`open` (default), `archived` or `all` (`all` is the default of the export).'
          example: open
          required: false
          schema:
            type: string
            enum:
              - open
              - archived
              - all
            nullable: true
        -
          in: query
          name: session
          description: 'Session ulid.'
          example: 01jax9yp7yy0htb0sk2v3x9vyc
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: linked
          description: '`1` only chats a hand-off ticket linked to a visitor, `0` only the others.'
          example: true
          required: false
          schema:
            type: boolean
            nullable: true
        -
          in: query
          name: widget
          description: 'Widget ulid.'
          example: 01ja10epadeh9792bzqsvwt6xg
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: category
          description: 'Category ulid or slug. Must not be greater than 100 characters.'
          example: billing
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: unread
          description: '`1`: only chats with unread messages.'
          example: true
          required: false
          schema:
            type: boolean
            nullable: true
        -
          in: query
          name: q
          description: "Search: the number, push name, last message, the linked visitor's name, e-mail or phone, or the text of any message. Must not be greater than 200 characters."
          example: invoice
          required: false
          schema:
            type: string
            nullable: true
