  /api/v1/whatsapp/chats:
    get:
      summary: 'List WhatsApp chats'
      operationId: whatsappChatsIndex
      description: "The admin inbox, newest activity first, cursor-paged. `meta.unread_chats` counts the open chats with unread messages (all sessions, ignoring the filters).\n\n**Access.** Administrators only (agents get `403`; nothing says that WhatsApp exists).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
