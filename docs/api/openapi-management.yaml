          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: unread
          description: '`1`: only chats with unread messages.'
          example: true
          required: false
          schema:
            type: boolean
            nullable: true
        -
          in: query
          name: q
          description: "Search: the number, push name, last message, the linked visitor's name, e-mail or phone, or the text of any message. Must not be greater than 200 characters."
          example: invoice
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: from
          description: 'Export only: messages at or after this instant (a bare date covers the whole day). Must be a valid date.'
          example: '2026-09-01'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: to
          description: 'Export only: messages at or before this instant. Must be a valid date.'
          example: '2026-09-30'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: format
          description: 'Export only: `csv` (default) or `json`.'
          example: csv
          required: false
          schema:
            type: string
            enum:
              - csv
              - json
            nullable: true
        -
          in: query
          name: resource
          description: 'Export only: `messages` (default, one row per message) or `chats`.'
          example: messages
          required: false
          schema:
            type: string
            enum:
              - messages
              - chats
            nullable: true
      responses:
        200:
          description: 'A CSV or JSON file.'
          content:
            text/plain:
              schema:
                type: string
                example: "chat,direction,type,body,status,wa_timestamp\n"
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not an active administrator."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        422:
          description: '`validation_failed`: A filter is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'WhatsApp (admin only)'
  '/api/v1/whatsapp/media/{message}':
    get:
      summary: 'Fetch a stored WhatsApp image'
      operationId: whatsappMediaShow
      description: "The target of the signed `media.url` in message payloads (60 minutes). Two credentials: the URL signature (an `<img>` cannot send a bearer token) AND an administrator's session, so a URL that leaks is useless to anybody else. Streamed from the private disk with `nosniff` and a sandboxing CSP.\n\n**Access.** No bearer token: the URL's signature is the credential (it names exactly one attachment and expires).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: 'The stored image.'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Bad or expired signature, or not an administrator."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'WhatsApp (admin only)'
    parameters:
      -
        in: path
        name: message
        description: 'The ulid of the WhatsApp message.'
        example: 01jcpyz1ssnda3sd58hdrej54g
        required: true
        schema:
          type: string
