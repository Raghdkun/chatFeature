                    $ref: '#/components/schemas/DeviceToken'
        201:
          description: 'A new registration.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/DeviceToken'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
