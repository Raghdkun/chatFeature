    StaffMe:
      type: object
      description: "The answer of `GET /api/v1/auth/me`: who the credential belongs to (the same `AuthUserData` the dashboard receives), which auth driver is active and what it allows, the bearer token the call was made with (`null` for the dashboard's session cookie), the public Reverb address a native client opens its websocket at (the dashboard gets the same from an Inertia shared prop) and the server clock, so a mobile client can correct its clock skew."
      required:
        - user
        - mode
        - capabilities
        - token
        - realtime
        - serverTime
      properties:
        user:
          allOf:
            -
              $ref: '#/components/schemas/AuthUser'
          description: 'The signed-in staff member.'
        mode:
          type: string
          enum:
            - fortify
            - pizzasys
          description: 'The active auth driver: `fortify` (local accounts) or `pizzasys` (external auth portal).'
        capabilities:
          allOf:
            -
              $ref: '#/components/schemas/AuthCapabilities'
          description: 'What the active driver lets the user do (hide UI it cannot honour).'
        token:
          allOf:
            -
              $ref: '#/components/schemas/ApiToken'
          description: "The bearer token this call was made with; `null` when the call used the dashboard's session cookie."
          nullable: true
        realtime:
          allOf:
            -
              $ref: '#/components/schemas/RealtimeEndpoint'
          description: 'Where to open the websocket (Laravel Reverb, Pusher protocol) and the public app key; `null` when realtime is not configured, then stay on REST polling. Authorise private channels with `POST /broadcasting/auth` and your bearer token.'
          nullable: true
        serverTime:
          type: string
          description: 'The server clock (ISO-8601 UTC). Compare it with your own to correct clock skew before counting down any `expiresAt`.'
      example:
        user:
          id: 7
          name: 'Sam Rivera'
          email: ada@example.com
