                        description: 'Always `null`: this list is complete.'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Conversations
  /api/v1/conversations/export:
    get:
      summary: 'Export conversations'
      operationId: conversationsExport
      description: "Streams the filtered range as CSV (default) or JSON, in chunks of 500 (flat memory; PHP's time limit is lifted for the stream) with `Content-Disposition: attachment`. CSV cells that start with `=`, `+`, `-`, `@`, tab or CR are prefixed with a quote. The export is recorded in the audit log (`conversations.exported`) because it hands out personal data in bulk.\n\nCSV columns (also the keys of each JSON row, which is wrapped in `{ \"data\": [...] }`): `ticket_no`, `conversation`, `type`, `status`, `widget`, `category`, `agent`, `visitor_name`, `visitor_email`, `visitor_verified`, `created_at`, `claimed_at`, `ended_at`, `closed_at`, `ended_by`, `close_reason`, `messages`, `rating`.\n\n**Access.** Administrators only.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      parameters:
        -
          in: query
          name: status
          description: 'Comma-separated statuses: `queued`, `active`, `ended`, `closed`, `missed`. Must not be greater than 100 characters.'
          example: 'active,queued'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: category
          description: 'Category ulid or slug. Must not be greater than 100 characters.'
          example: billing
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: widget
          description: 'Widget ulid.'
          example: 01ja10epadeh9792bzqsvwt6xg
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: agent
          description: 'Assigned agent: a staff user id, or `me`. Must match the regex /^(?:me|[0-9]+)$/D. Must not be greater than 20 characters.'
          example: me
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: type
          description: '`live` chats or `offline` tickets.'
          example: live
          required: false
          schema:
            type: string
            enum:
              - live
              - offline
            nullable: true
        -
          in: query
          name: q
          description: "Search: part of the ticket number, the visitor's name, e-mail or phone, or message text (MySQL FULLTEXT: every word is a prefix and all are required; words under 3 characters use LIKE). Must not be greater than 200 characters."
          example: invoice
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: from
          description: 'Created at or after this instant (an offset like `+03:00` is honoured). Must be a valid date.'
          example: '2026-09-01T00:00:00Z'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: to
          description: 'Created at or before this instant. Must be a valid date.'
          example: '2026-09-30T23:59:59Z'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: updated_after
          description: 'Changed at or after this instant (inclusive, so a change in the second of your last sync is not lost; merge by ulid). The incremental sync after a reconnect. Must be a valid date.'
          example: '2026-09-30T12:00:00.000Z'
          required: false
          schema:
            type: string
            nullable: true
        -
          in: query
          name: format
          description: 'Export only: `csv` (default) or `json`.'
          example: csv
          required: false
          schema:
            type: string
            enum:
              - csv
              - json
            nullable: true
      responses:
        200:
          description: 'A CSV file (or, with `format=json`, `{ "data": [ { ...one object per conversation } ] }`).'
          content:
            text/plain:
              schema:
                type: string
                example: "ticket_no,conversation,type,status,widget,category,agent,visitor_name,visitor_email,visitor_verified,created_at,claimed_at,ended_at,closed_at,ended_by,close_reason,messages,rating\nX4BWQW,01j9z3q8x7m5n2k4p6r8t0v1w2,live,closed,Main website,Billing,Sam Rivera,Ada Lovelace,ada@example.com,false,2026-09-30T12:00:00.000Z,2026-09-30T12:00:18.000Z,2026-09-30T12:12:09.000Z,2026-09-30T12:13:00.000Z,agent,rated,14,5\n"
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
