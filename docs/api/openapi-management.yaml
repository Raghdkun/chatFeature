              type: object
              properties:
                agent_id:
                  type: integer
                  description: 'Hand the chat to this colleague (user id from `transfer-targets`). Give this or `category`. This field is required when <code>category</code> is not present. Must match an existing stored value. Must be at least 1.'
                  example: 7
                  nullable: true
                category:
                  type: string
                  description: 'Hand the chat to a topic (ulid or slug): it is queued again and offered through the routing waves. Give this or `agent_id`. This field is required when <code>agent_id</code> is not present. Must not be greater than 100 characters.'
                  example: billing
                  nullable: true
    parameters:
      -
        in: path
        name: conversation
        description: 'The ulid of the conversation.'
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/conversations/{conversation}/messages':
    get:
      summary: 'List messages'
      operationId: conversationsMessagesIndex
      description: "Messages after `after_seq`, ascending by `seq`, at most `limit`. `meta.next_cursor` is the `after_seq` of the next page and `null` at the end. Staff payloads carry the sender's staff id (`sender.id`).\n\n**Gap sync.** Every client keeps the highest `seq` it holds per conversation and, after a reconnect, when the app returns to the foreground or when it sees a gap, calls this with `after_seq` set to it: no duplicates, no holes. Realtime events are an optimisation, never the only source.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      parameters:
        -
          in: query
          name: after_seq
          description: 'Return the messages whose `seq` is greater than this (0 or absent: from the start). After a reconnect pass the last `seq` you hold. Must be at least 0. Must not be greater than 2147483647.'
          example: 14
          required: false
          schema:
            type: integer
            nullable: true
        -
          in: query
          name: limit
          description: 'Page size, default 100, at most 200. Must be at least 1. Must not be greater than 200.'
          example: 100
          required: false
          schema:
            type: integer
            nullable: true
      responses:
        200:
          description: 'A page of messages.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Opaque cursor of the next page: pass it as `cursor`. `null` on the last page.'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
