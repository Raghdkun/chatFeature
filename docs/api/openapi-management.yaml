          code: session_not_stoppable
          message: 'This session is not running.'
    ErrorSessionRevoked:
      type: object
      description: 'The credential was valid but has ended: a deactivated account, a role that was removed, a session the auth portal revoked, a visitor token that expired or was rotated away. Drop the stored credential and sign in (or start a session) again.'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - session_revoked
            message:
              type: string
              example: 'Your session has ended. Please sign in again.'
      example:
        error:
          code: session_revoked
          message: 'Your session has ended. Please sign in again.'
    ErrorSlugTaken:
      type: object
      description: 'Category slug already in use (also when lost in a race).'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - slug_taken
            message:
              type: string
              example: 'This slug is already used by another category.'
      example:
        error:
          code: slug_taken
          message: 'This slug is already used by another category.'
    ErrorSubscriptionNotFound:
      type: object
      description: "The push subscription is not the caller's (or does not exist)."
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - subscription_not_found
            message:
              type: string
              example: 'This device is not registered.'
      example:
        error:
          code: subscription_not_found
          message: 'This device is not registered.'
    ErrorTokenNotFound:
      type: object
      description: "The token id is not one of the caller's own tokens."
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - token_not_found
            message:
              type: string
              example: 'This token does not exist.'
      example:
        error:
          code: token_not_found
          message: 'This token does not exist.'
    ErrorUnauthenticated:
      type: object
      description: 'No credential, or one the server does not know (an unknown, deleted or expired token).'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - unauthenticated
            message:
              type: string
              example: 'Authentication is required.'
      example:
        error:
          code: unauthenticated
          message: 'Authentication is required.'
    ErrorValidationFailed:
      type: object
      description: 'The body or query did not pass validation. `details` is keyed by field name (nested fields use dots, `visitor.email`), each value a list of messages.'
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - validation_failed
            message:
              type: string
              example: 'The given data was invalid.'
            details:
              type: object
              example:
                email:
                  - 'The email field must be a valid email address.'
      example:
        error:
          code: validation_failed
          message: 'The given data was invalid.'
          details:
            email:
              - 'The email field must be a valid email address.'
    ErrorWebhookLimitReached:
      type: object
      description: "The gateway's 16 webhooks per session are used up."
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - webhook_limit_reached
            message:
              type: string
              example: 'OpenWA has no room for another webhook on this session.'
      example:
        error:
          code: webhook_limit_reached
          message: 'OpenWA has no room for another webhook on this session.'
    ErrorWebhookRejected:
      type: object
      description: "The gateway's SSRF guard refused our callback address (the message names the host to allow)."
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - webhook_rejected
            message:
              type: string
              example: 'OpenWA refused the webhook address.'
      example:
        error:
          code: webhook_rejected
          message: 'OpenWA refused the webhook address.'
security:
  -
    default: []
paths:
  /api/v1/auth/me:
    get:
      summary: 'Show the signed-in user'
      operationId: authMe
      description: "The first call a client makes after signing in, and a cheap way to check that a stored token still works (`401 unauthenticated` / `session_revoked` otherwise).\n\nIt returns the same user object the dashboard receives, which auth driver is active (`fortify`: accounts of this installation, `pizzasys`: an external auth portal) and what that driver lets the user do, the bearer token the call was made with (`null` when the dashboard's session cookie was used), the public address and key of the realtime (websocket) server, and the server clock: compare `serverTime` with your own clock to correct clock skew before you count down any `expiresAt`.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "The answer of `GET /api/v1/auth/me`: who the credential belongs to (the same `AuthUserData` the dashboard receives), which auth driver is active and what it allows, the bearer token the call was made with (`null` for the dashboard's session cookie), the public Reverb address a native client opens its websocket at (the dashboard gets the same from an Inertia shared prop) and the server clock, so a mobile client can correct its clock skew."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/StaffMe'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Authentication
  /api/v1/auth/tokens:
    get:
      summary: 'List my tokens'
      operationId: authTokensIndex
      description: "The caller's own bearer tokens, newest first: one per device that signed in (the name is the device name given at sign-in). `current` marks the token this call was made with. The token strings themselves are never returned again (only a hash is stored).\n\nTokens do not slide: each one stops working at `expiresAt` (issue time plus `SANCTUM_EXPIRATION_MINUTES`, 30 days by default), and deactivating the account or removing its last chat role deletes them all.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "One of a staff member's own API (bearer) tokens, as `GET /api/v1/auth/tokens` and `GET /api/v1/auth/me` show it."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiToken'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Always `null`: this list is complete.'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Authentication
  '/api/v1/auth/tokens/{token}':
    delete:
      summary: 'Revoke one of my tokens'
      operationId: authTokensDestroy
      description: "Signs one of the caller's devices out. Only the caller's own tokens can be found: someone else's id is `404 token_not_found`, never `403`. With the external auth portal the portal session behind the token ends too, and the portal token is logged out upstream.\n\nTo sign out the device you are using, call `POST /auth/logout`.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        204:
          description: Revoked.
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        404:
          description: "- `not_found`: Unknown id.\n- `token_not_found`: The id is not one of the caller's own tokens."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNotFound'
                  -
                    $ref: '#/components/schemas/ErrorTokenNotFound'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Authentication
    parameters:
      -
        in: path
        name: token
        description: "The id of one of the caller's own tokens (anyone else's is `404`)."
        example: 12
        required: true
        schema:
          type: integer
  /api/v1/auth/logout:
    post:
      summary: 'Sign out this device'
      operationId: authLogout
      description: "Revokes the bearer token the call was made with, and only that one: the user's other devices keep theirs. A mobile app calls it on sign-out and then deletes its stored token and any realtime connection.\n\nCalled with the dashboard's session cookie instead of a bearer token it answers `409 not_a_token_session`: the dashboard signs out with `POST /logout`.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        204:
          description: 'The token is revoked.'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        409:
          description: '`not_a_token_session`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotATokenSession'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Authentication
  /api/v1/me/presence:
    get:
      summary: 'Show my presence'
      operationId: mePresenceShow
      description: "The caller's EFFECTIVE status: silence (no heartbeat for 90 seconds) and auto-away are already applied, exactly as routing, the public availability and the roster read it.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "A staff member's presence (`GET /me/presence`): the status, whether they chose it themselves, and when they were last seen."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Presence'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Presence
    put:
      summary: 'Choose my status'
      operationId: mePresenceUpdate
      description: "Sets `online`, `away` or `offline`; it counts as a heartbeat for `online` and `away`. A status is **pinned** (`isManual: true`) unless `automatic: true` accompanies `online`: then the app keeps the agent `online` while it is visible and the server moves them to `away` after `presence.auto_away_minutes` (5) of hidden heartbeats. The dashboard sends `online` with `automatic: true`.\n\nThis is the only call that turns an `offline` agent back on: a heartbeat never does.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "A staff member's presence (`GET /me/presence`): the status, whether they chose it themselves, and when they were last seen."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Presence'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        422:
          description: '`validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Presence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'The status to choose. `offline` stops routing to the agent and keeps them listed.'
                  example: online
                  enum:
                    - online
                    - away
                    - offline
                automatic:
                  type: boolean
                  description: 'Only meaningful with `online`: let heartbeats move the agent between `online` and `away` by whether the app is visible (what the dashboard does) instead of pinning `online`.'
                  example: true
              required:
                - status
  /api/v1/me/presence/heartbeat:
    post:
      summary: 'Send a heartbeat'
      operationId: mePresenceHeartbeat
      description: "Call it every 30 seconds while the app is open, with `visible` saying whether it is in the foreground (a backgrounded mobile app sends `false`; absent counts as `true`). It refreshes an `online` or `away` agent and never turns an `offline` one on, nor revives an agent whose record expired (3 minutes after the last sign of life).\n\nThe answer is the EFFECTIVE status, so a client whose record the server lost learns at once that it is `offline` and shows its \"Go online\" prompt. An agent who chose `offline` keeps sending heartbeats while looking at the app: their status does not change.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "A staff member's presence (`GET /me/presence`): the status, whether they chose it themselves, and when they were last seen."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Presence'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        422:
          description: '`validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Presence
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                visible:
                  type: boolean
                  description: 'Whether the sending app or tab is in the foreground (default `true`). A backgrounded mobile app sends `false` so automatic agents drift to `away` after the auto-away minutes.'
                  example: true
                  nullable: true
  /api/v1/me/notification-settings:
    get:
      summary: 'Show my notification settings'
      operationId: meNotificationSettingsShow
      description: "A member who never saved anything gets the defaults (everything on, quiet hours off at `22:00` to `07:00` in their own timezone, `promptState: never`) and no row is created.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "A member of staff's notification preferences (`GET/PUT /me/notification-settings`) and where they are in the first-login dialog."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSettings'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Notifications
    put:
      summary: 'Change my notification settings'
      operationId: meNotificationSettingsUpdate
      description: "Any subset of the fields. `quiet_hours` is merged field by field into what is saved, and the rule that start and end differ is applied to the merged result.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: "A member of staff's notification preferences (`GET/PUT /me/notification-settings`) and where they are in the first-login dialog."
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationSettings'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        422:
          description: '`validation_failed`: A field is invalid, or the merged quiet hours start and end at the same time (reported on the field the request changed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Notifications
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sound:
                  type: boolean
                  description: 'Play a sound in the dashboard.'
                  example: true
                push_offers:
                  type: boolean
                  description: 'Push when a chat is offered.'
                  example: true
                push_messages:
                  type: boolean
                  description: 'Push for new messages.'
                  example: true
                include_preview:
                  type: boolean
                  description: "Include message text in pushes (needs the administrator's `previewsAllowed`)."
                  example: false
                quiet_hours:
                  type: object
                  description: 'The "do not push me" window, merged field by field into what is saved.'
                  example: null
                  properties:
                    enabled:
                      type: boolean
                      description: 'Switch the window on.'
                      example: true
                    start:
                      type: string
                      description: '`HH:MM`. Must match the regex /^([01]\d|2[0-3]):([0-5]\d)$/.'
                      example: '22:00'
                    end:
                      type: string
                      description: '`HH:MM`; with the window on it must differ from `start`. Must match the regex /^([01]\d|2[0-3]):([0-5]\d)$/.'
                      example: '07:00'
                    timezone:
                      type: string
                      description: 'IANA timezone. Must be a valid time zone, such as <code>Africa/Accra</code>. Must not be greater than 64 characters.'
                      example: Europe/Berlin
                prompt_state:
                  type: string
                  description: 'The answer to the first-login notification dialog. `snoozed` hides it for `snoozeDays` (computed by the server).'
                  example: granted
                  enum:
                    - never
                    - granted
                    - denied
                    - snoozed
  /api/v1/me/push-subscriptions:
    get:
      summary: 'List my push subscriptions'
      operationId: mePushSubscriptionsIndex
      description: "The caller's browsers that receive web push, newest first. The endpoint and the keys are never returned.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: 'A browser that receives pushes (`/me/push-subscriptions`).'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PushSubscription'
                  meta:
                    type: object
                    required:
                      - next_cursor
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        description: 'Always `null`: this list is complete.'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - Notifications
    post:
      summary: 'Register a browser for push'
      operationId: mePushSubscriptionsStore
      description: "Takes the browser's `PushSubscription.toJSON()`. An **upsert by the hash of the endpoint**: `201` for a new browser, `200` when it was known (keys refreshed). A browser another member of staff signed in to is handed over to the caller. At most `push.max_subscriptions_per_user` (10) are kept; the least recently used go first.\n\nThe endpoint must be an https URL of a **public** host on port 443 (loopback, private and metadata addresses are refused whatever `PORTAL_ALLOW_PRIVATE_HOSTS` says, because the server posts to it).\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member.\n- `push-subscriptions`: 20 a minute per staff member."
      responses:
        200:
          description: 'A browser the server already knew.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PushSubscription'
        201:
          description: 'A new browser.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PushSubscription'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: '`no_chat_access`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNoChatAccess'
        422:
          description: '`validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: "- `auth_unavailable`\n- `push_unavailable`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorAuthUnavailable'
                  -
                    $ref: '#/components/schemas/ErrorPushUnavailable'
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint:
                  type: string
                  description: "The browser's push endpoint: an https URL of a public host on port 443 (the server posts to it). Must not be greater than 2048 characters."
                  example: 'https://fcm.googleapis.com/fcm/send/dZ3tq1Zr0Vc:APA91bH'
                keys:
                  type: object
                  description: 'The subscription keys (`PushSubscription.toJSON().keys`).'
                  example: []
                  properties:
                    p256dh:
                      type: string
                      description: 'URL-safe base64 of the 65-byte uncompressed P-256 public key. Must not be greater than 128 characters.'
                      example: BNcRdreALRFXTkOOUHK1EtK2wtaz5Ry4YfYCA_0QTpQtUbVlUls0VJXg7A8u-Ts1XbjhazAkj7I99e8QcYP7DkM
                    auth:
                      type: string
                      description: 'URL-safe base64 of the 16-byte auth secret. Must not be greater than 64 characters.'
                      example: tBHItJI5svbpez7KI4CCXg
                  required:
                    - p256dh
                    - auth
                expirationTime:
                  type: number
                  description: "The subscription's expiration time as the browser reports it, or `null`. Must be at least 0."
                  example: null
                  nullable: true
                content_encoding:
                  type: string
                  description: '`aes128gcm` (default) or `aesgcm`.'
                  example: aes128gcm
                  enum:
                    - aes128gcm
                    - aesgcm
              required:
                - endpoint
                - keys
