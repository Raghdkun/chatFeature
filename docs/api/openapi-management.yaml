  '/webhooks/openwa/{session}':
    post:
      summary: 'OpenWA webhook (inbound)'
      operationId: webhooksOpenwa
      description: "Called by the OpenWA gateway for the session registered with this URL, never by a client. Before anything is stored: the body is at most 1 MiB, and `X-OpenWA-Signature: sha256=<hex>` must equal the HMAC-SHA256 of the **raw body** with the session's webhook secret (constant-time compare). Missing, malformed, wrong or another session's signature all answer the same `401`. Everything is read from the signed body; the other `X-OpenWA-*` headers are never read.\n\nA verified delivery is stored on a ledger (unique per session and idempotency key) and answered at once: `accepted`, or `duplicate` for a repeat; a queued job applies it. Events handled: `message.received`, `message.sent`, `message.ack`, `message.failed`, `session.status`, `session.qr`, `session.authenticated`, `session.disconnected`, `session.reconnect_loop`; anything else is acknowledged and ignored.\n\n**Access.** Called by the OpenWA gateway, never by a client. The only credential is the HMAC-SHA256 signature of the raw body (`X-OpenWA-Signature`); nothing is stored before it verifies.\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `wa-webhook`: 3000 a minute per session and client network, 6000 per client network."
      parameters:
        -
          in: header
          name: X-OpenWA-Signature
          description: ''
          example: sha256=3b1f0c9e5a7d2e4f6a8b0c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f7
          schema:
            type: string
      responses:
        200:
          description: 'Stored for processing (`duplicate` when the same delivery arrives again). Not wrapped in `data`.'
          content:
            application/json:
              schema:
                type: object
                example:
                  status: accepted
                properties:
                  status:
                    type: string
                    example: accepted
                    description: '`accepted` or `duplicate`.'
                required:
                  - status
        400:
          description: '`invalid_webhook`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInvalidWebhook'
        401:
          description: '`unauthenticated`: The signature is missing, malformed or wrong.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorUnauthenticated'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        413:
          description: '`payload_too_large`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayloadTooLarge'
        422:
          description: '`validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'WhatsApp (admin only)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: 'The event name (letters, digits, dots, hyphens, underscores).'
                  example: message.received
              required:
                - event
      security: []
    parameters:
      -
        in: path
        name: session
        description: 'The ulid of the WhatsApp session.'
        example: 01jax9yp7yy0htb0sk2v3x9vyc
        required: true
        schema:
          type: string
