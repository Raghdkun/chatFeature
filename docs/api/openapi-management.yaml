              schema:
                type: integer
      tags:
        - 'WhatsApp (admin only)'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: 'Master switch of the visitor-facing side (hand-off, `availability.whatsapp.enabled`). Recording of inbound messages does not depend on it.'
                  example: true
                base_url:
                  type: string
                  description: 'Address of the OpenWA gateway (checked by the outbound address guard). A changed address needs `api_key` in the same request. Must not be greater than 255 characters.'
                  example: 'https://openwa.example.com'
                api_key:
                  type: string
                  description: 'Write-only. Printable ASCII without spaces; stored encrypted and never returned. Must match the regex /^[\x21-\x7e]+$/D. Must not be greater than 255 characters.'
                  example: owa_live_xxxxxxxxxxxxxxxx
                  nullable: true
                clear_api_key:
                  type: boolean
                  description: 'Remove the stored key.'
                  example: false
                handoff_ttl_minutes:
                  type: integer
                  description: 'How long a hand-off code lives.'
                  example: 15
                handoff_text:
                  type: string
                  description: 'The text WhatsApp opens with; it must contain `:code` (one line, at most 200 characters). Must not be greater than 500 characters.'
                  example: 'Hi, my chat code is :code'
                ignore_groups:
                  type: boolean
                  description: 'Do not record group chats.'
                  example: true
                reply_only_to_inbound:
                  type: boolean
                  description: 'Refuse replies to chats the customer never wrote in.'
                  example: true
                send_min_interval_ms:
                  type: integer
                  description: 'Global minimum pause between two sends of one session.'
                  example: 3000
                daily_send_cap:
                  type: integer
                  description: 'Global messages per session and UTC day.'
                  example: 200
