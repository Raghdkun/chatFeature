                  description: 'Largest image stored.'
                  example: 5242880
                retention_days:
                  type: integer
                  description: 'Delete chats and messages older than this (0 = keep for ever).'
                  example: 0
                raw_retention_days:
                  type: integer
                  description: 'Drop the raw webhook object kept for debugging after this many days (0 = never kept).'
                  example: 30
