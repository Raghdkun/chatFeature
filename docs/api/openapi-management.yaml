      summary: 'Send a message'
      operationId: conversationsMessagesStore
      description: "Only the assigned agent or an administrator, and only while the chat is `active`. A reply on an **offline ticket** is also e-mailed (a queued mail) to the visitor's address.\n\n**Idempotent.** Send a `client_msg_id` (a ULID you make up): a repeat answers `200` with the original message instead of storing a second one, also after the chat ended, so a flaky connection can retry blindly.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        200:
          description: 'A repeat of a `client_msg_id` already stored: the original message.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        201:
          description: 'The message was stored.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not the assigned agent or an administrator."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: '`conversation_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConversationNotActive'
        422:
          description: '`validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Messages & attachments'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                client_msg_id:
                  type: string
                  description: 'A ULID the client makes up. Sending the same id again returns the original message with `200` instead of storing a duplicate: retry a failed request safely.'
                  example: 01j9z3q8x7m5n2k4p6r8t0v1w3
                  nullable: true
                body:
                  type: string
                  description: 'Plain text, at most `limits.maxMessageLength` characters (default 4000). Required unless `attachments` is given. This field is required when <code>attachments</code> is not present. Must not be greater than 4000 characters.'
                  example: 'Are you there?'
                  nullable: true
                attachments:
                  type: array
                  description: 'Ulid of an uploaded image.'
                  example:
                    - 01j0ay932vvkjhp0dcv6p5r0j8
                  items:
                    type: string
    parameters:
      -
        in: path
        name: conversation
        description: 'The ulid of the conversation.'
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/conversations/{conversation}/attachments':
    post:
      summary: 'Upload an image'
      operationId: conversationsAttachmentsStore
      description: "Multipart upload of one image into an active chat, then reference its `ulid` in the next message (`attachments`). The image is judged by content, decoded and encoded again (so EXIF and anything hidden in it do not survive), a 320 px thumbnail is made and the files go to a private disk behind signed URLs. Unreferenced uploads are deleted after 24 hours.\n\nA native client builds the multipart body itself: field name `file`, a real file part with its own content type.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        201:
          description: 'An image attached to a message.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Attachment'
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not the assigned agent or an administrator.\n- `feature_disabled`: The widget switched attachments off."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
                  -
                    $ref: '#/components/schemas/ErrorFeatureDisabled'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        409:
          description: '`conversation_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConversationNotActive'
        422:
          description: "- `validation_failed`: Not a JPEG, PNG, WebP or still GIF by content, an animated GIF, too large in bytes or pixels, or ten uploads are already waiting. The message is under `details.file`.\n- `attachment_quota_exceeded`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorValidationFailed'
                  -
                    $ref: '#/components/schemas/ErrorAttachmentQuotaExceeded'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Messages & attachments'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'One image: JPEG, PNG, WebP or a still GIF, within `limits.attachmentMaxBytes` (default 5 MB) and `attachmentMaxDimension` pixels. It is judged by its content, not its name or declared type; SVG, PDF, animated GIFs and anything else is refused. EXIF and other metadata do not survive (the image is re-encoded). Must be a file. Must not be greater than 5120 kilobytes.'
              required:
                - file
    parameters:
      -
        in: path
        name: conversation
        description: 'The ulid of the conversation.'
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
  '/api/v1/conversations/{conversation}/receipts':
    post:
      summary: 'Report delivery and read receipts'
      operationId: conversationsReceiptsStore
      description: "Only the assigned agent (an administrator looking in does not mark a chat read). It stamps `deliveredAt` / `seenAt` on the visitor's messages up to the given numbers (reading implies delivery) and announces `message.delivered` / `message.seen` on the conversation channel; repeating a receipt changes and announces nothing. Batch them: report once per screen, not per message.\n\n**Access.** Any signed-in staff member (administrator or agent).\n\n**Rate limits.** `429 rate_limited` with `Retry-After` when exceeded.\n\n- `staff-api`: 600 calls a minute per staff member."
      responses:
        204:
          description: Recorded.
        401:
          description: "- `unauthenticated`\n- `session_revoked`"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorUnauthenticated'
                  -
                    $ref: '#/components/schemas/ErrorSessionRevoked'
        403:
          description: "- `no_chat_access`\n- `forbidden`: Not the assigned agent."
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: '#/components/schemas/ErrorNoChatAccess'
                  -
                    $ref: '#/components/schemas/ErrorForbidden'
        404:
          description: '`not_found`: Unknown id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNotFound'
        422:
          description: '`validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidationFailed'
        429:
          description: '`rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRateLimited'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
        503:
          description: '`auth_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorAuthUnavailable'
          headers:
            Retry-After:
              description: 'Seconds to wait before trying again.'
              schema:
                type: integer
      tags:
        - 'Messages & attachments'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                delivered_upto:
                  type: integer
                  description: 'Highest message `seq` this client has received. At least one of the two fields is required. This field is required when <code>seen_upto</code> is not present. Must be at least 0. Must not be greater than 2147483647.'
                  example: 14
                  nullable: true
                seen_upto:
                  type: integer
                  description: 'Highest message `seq` the user has actually read (reading implies delivery). This field is required when <code>delivered_upto</code> is not present. Must be at least 0. Must not be greater than 2147483647.'
                  example: 14
                  nullable: true
    parameters:
      -
        in: path
        name: conversation
        description: 'The ulid of the conversation.'
        example: 01j9z3q8x7m5n2k4p6r8t0v1w2
        required: true
        schema:
          type: string
