; PHP-FPM pool of the PNE Chat `app` image. Replaces the image's www.conf.
; FPM listens on a UNIX SOCKET shared with the Caddy container (volume `fpm-socket`), not on a TCP port: FastCGI has no
; authentication, so a TCP listener would let any container on a shared network (OpenWA!) run PHP.
[www]
listen = /run/php/php-fpm.sock
listen.mode = 0666

pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
pm.max_requests = 500
request_terminate_timeout = 70s

; Compose passes the whole configuration as environment variables: FPM must not clear them.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; Liveness probe for the container health check (cgi-fcgi, no application code involved).
ping.path = /ping
ping.response = pong
