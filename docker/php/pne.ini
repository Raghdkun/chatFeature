; PNE Chat production overrides, loaded after php.ini-production (docker/php, copied to conf.d/zz-pne.ini).
expose_php = Off
date.timezone = UTC
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
; Attachments: chat.attachment_max_bytes can be raised in Settings up to 25 MiB; the multipart body is a little larger than the file.
upload_max_filesize = 26M
post_max_size = 28M
max_file_uploads = 5

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off
zend.assertions = -1
cgi.fix_pathinfo = 0
allow_url_include = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache: the image is immutable, so PHP never has to look at file timestamps again.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
