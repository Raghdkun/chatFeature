# Dev-only helpers. Nothing here is required for the default workflow: the app uses
# the local MySQL + Redis. Start what you need with profiles, e.g.
#   docker compose -f docker/compose.dev.yml up -d mailpit
#   docker compose -f docker/compose.dev.yml --profile nats up -d
#   docker compose -f docker/compose.dev.yml --profile whatsapp up -d
#   docker compose -f docker/compose.dev.yml --profile full up -d   # mysql + redis in containers
name: pne-chat-dev

services:
    mailpit:
        image: axllent/mailpit:latest
        ports:
            - '8025:8025' # web UI
            - '1025:1025' # SMTP  (MAIL_MAILER=smtp MAIL_HOST=127.0.0.1 MAIL_PORT=1025)

    mysql:
        profiles: [full]
        image: mysql:8.4
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
            MYSQL_DATABASE: chatfeature
        ports:
            - '3307:3306' # 3307 so it never collides with a local MySQL on 3306
        volumes:
            - mysql-data:/var/lib/mysql

    redis:
        profiles: [full]
        image: redis:7-alpine
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '6380:6379'
        volumes:
            - redis-data:/data

    # NATS with JetStream: used by the pizzasys auth mode (user/role event mirror).
    nats:
        profiles: [nats]
        image: nats:2.11-alpine
        command: ['-js', '-sd', '/data', '-m', '8222']
        ports:
            - '4222:4222'
            - '8222:8222' # monitoring
        volumes:
            - nats-data:/data

    # OpenWA WhatsApp gateway: REST API + dashboard on http://127.0.0.1:2785 (loopback only: the admin API key must not be reachable from the network).
    # Ops guide, QR pairing, the production fragment and the troubleshooting table: docs/whatsapp-openwa.md.
    #   docker compose -f docker/compose.dev.yml --profile whatsapp up -d openwa
    #   docker exec pne-chat-dev-openwa-1 cat /app/data/.api-key      # the admin key, minted on the first start (also in the first start log)
    #   node scripts/openwa-smoke.mjs                                  # connectivity / role / session / QR / webhook check
    # The image is pinned by the digest of its multi-arch index (OpenWA 0.23.7, what the fixtures in tests/fixtures/openwa were recorded
    # from); set OPENWA_IMAGE to try another one.
    openwa:
        profiles: [whatsapp]
        image: ${OPENWA_IMAGE:-ghcr.io/rmyndharis/openwa@sha256:9a9eeee07de00902ca41b30c67cc4a3bb2b219df5c5e54357994f66a1808ee12}
        environment:
            ENGINE_TYPE: whatsapp-web.js
            # OpenWA refuses webhook addresses that resolve to a private / loopback / Docker-internal host UNLESS the exact host name is
            # listed here (comma separated, no wildcards, no ports). `host.docker.internal` is the app running on this Mac / PC: set the
            # app's `app.url` to http://host.docker.internal:<port> (or use a tunnel) so the address the app registers is that one.
            SSRF_ALLOWED_HOSTS: host.docker.internal
            # Senders identified by a privacy id (@lid) get a `senderPhone` in message.received (otherwise there is no number).
            RESOLVE_LID_TO_PHONE: 'true'
            # Paired sessions start again by themselves after a container restart (default off: they would stay `disconnected`).
            AUTO_START_SESSIONS: 'true'
            # The dashboard is served over plain http here; the production default (upgrade-insecure-requests) renders it blank.
            CSP_UPGRADE_INSECURE_REQUESTS: 'false'
            # Let an in-flight webhook delivery (timeout 10 s) finish on shutdown.
            WEBHOOK_SHUTDOWN_DRAIN_MS: '10000'
            # VALIDATION_ERROR_DETAIL: 'true'   # 400 bodies with field detail (production: bare {"message":"Bad Request"}; the app handles both)
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:2785:2785'
        volumes:
            - openwa-data:/app/data # sessions (the WhatsApp login!), API keys, message store: back it up, never delete it casually
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://localhost:2785/api/health/ready || exit 1']
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

volumes:
    mysql-data:
    redis-data:
    nats-data:
    openwa-data:
