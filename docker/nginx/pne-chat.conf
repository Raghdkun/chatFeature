# nginx site for PNE Chat on a server whose nginx (+ certbot) is already installed. The stack runs with compose.nginx.yml: its `web` container
# (Caddy, plain HTTP) listens on 127.0.0.1:8088 and does all the routing (static files, PHP-FPM, Reverb); nginx only terminates TLS and proxies.
# Full walk-through: docs/deployment-vps-nginx.md.
#
#   sudo cp docker/nginx/pne-chat.conf /etc/nginx/sites-available/chat.example.com.conf        (put YOUR domain in the file name)
#   sudo sed -i 's/chat.example.com/YOUR.DOMAIN/g; s/127.0.0.1:8088/127.0.0.1:YOUR_PROXY_PORT/' /etc/nginx/sites-available/YOUR.DOMAIN.conf
#   sudo ln -s /etc/nginx/sites-available/YOUR.DOMAIN.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN --redirect        # adds the TLS listener, the certificate and the http -> https redirect to the server block below
#
# The file is written for the PORT-80 start state on purpose: certbot's nginx plugin completes it (listen 443 ssl, ssl_certificate lines, the
# redirect), so the proxy settings below apply to https without being repeated, and renewals keep working through the plugin.

# Websocket upgrade: `Connection: upgrade` only when the client asked for it (this `map` belongs in the http context, which is where
# files of sites-enabled / conf.d are included). If another site of yours already defines $connection_upgrade, delete this block.
map $http_upgrade $pne_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pne_chat {
    server 127.0.0.1:8088;      # compose.nginx.yml: PROXY_PORT
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    # Chat attachments: the largest the settings allow is 25 MiB plus multipart overhead; Caddy and PHP enforce the exact limit (30 MB).
    client_max_body_size 30m;

    # The response HEADERS of a dashboard page are big: the `Link: <...>; rel=preload` header that lists the page's scripts and fonts alone is about
    # 5 KB, plus the CSP, two cookies ... nginx's default buffer (4 or 8 KB) cannot hold that and answers `502 Bad Gateway` with "upstream sent too
    # big header" in its error log. This is not optional.
    proxy_buffer_size 32k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Reverb, the realtime websocket (wss://chat.example.com/app/<key>). Long-lived connections: Reverb pings every 30 s, the timeouts only
    # have to be longer than that. No buffering, frames must go through at once. (/apps/*, Reverb's publish API, is refused by Caddy.)
    location /app/ {
        proxy_pass http://pne_chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pne_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Everything else: the dashboard, /api, /embed, /w/<key>.js, the webhooks, the static build files.
    location / {
        proxy_pass http://pne_chat;
        proxy_http_version 1.1;
        proxy_set_header Connection "";                # keep the connections to the upstream open
        proxy_set_header Host $host;
        # nginx is the EDGE: it REPLACES X-Forwarded-For with the address it saw instead of appending to whatever a visitor sent. The
        # application trusts this header (TRUSTED_PROXIES=*), which is only safe because of this line and the 127.0.0.1 binding.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;    # https after certbot: secure cookies, HSTS and signed URLs depend on it
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # A bit longer than php-fpm's 70 s (Caddy), so the application answers before nginx gives up.
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
